version: 2

project_name: github-actions-gorelease-with-komac-test

before:
  hooks:
    - which komac
    - rm -rf ./dist
    - go mod tidy
    - git push
    - git push --tags
builds:
  -
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X main.Version=v{{.Version}}
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: github-actions-gorelease-with-komac-test

archives:
  - formats: [ "tar.gz" ]
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"

release:
  prerelease: auto
  extra_files:
    - glob: ./dist/github-actions-gorelease-with-komac-test_windows_amd64_v1/github-actions-gorelease-with-komac-test.exe

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
  algorithm: sha256

publishers:
  - name: komac
    cmd: sh -c 'GITHUB_TOKEN="{{ if .Env.KOMAC_GITHUB_TOKEN }}{{ .Env.KOMAC_GITHUB_TOKEN }}{{ else }}{{ .Env.GITHUB_TOKEN }}{{ end }}" komac update ondrejsikax.github-actions-gorelease-with-komac-test --version {{ .Version }} --urls https://github.com/ondrejsikax/github-actions-gorelease-with-komac-test/releases/download/v{{ .Version }}/github-actions-gorelease-with-komac-test.exe --submit > komac.txt'
